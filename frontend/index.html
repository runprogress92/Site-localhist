<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Athlytics — plateforme locale de suivi scientifique d'athlètes, connectée à Garmin, Polar et COROS.">
  <title>Athlytics — suivi d'athlètes</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">

  <!-- Installation sur l'écran d'accueil -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b0e13" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
  <meta name="application-name" content="Athlytics">

  <!-- iOS n'implémente pas le manifeste : ces balises jouent le même rôle -->
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Athlytics">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/charts.css">
  <link rel="stylesheet" href="/css/views.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content">
        <div class="loading-screen">
          <span class="spinner"></span>
          <span>Chargement…</span>
        </div>
      </main>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <noscript>
    <p style="padding:2rem;font-family:system-ui">
      Athlytics nécessite JavaScript. Activez-le pour utiliser l'application.
    </p>
  </noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
