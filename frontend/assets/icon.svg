<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icône source d'Athlytics.

  Le dessin doit rester lisible à 48 px sur un écran d'accueil encombré :
  une seule forme reconnaissable, beaucoup de contraste, aucun détail fin.
  La courbe reprend le motif du graphique de forme — montée, creux,
  remontée — qui est le cœur de l'application.

  Les PNG sont régénérés par :  python3 tools/make_icons.py
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5b9bff"/>
      <stop offset="52%"  stop-color="#4f8ff7"/>
      <stop offset="100%" stop-color="#7b56c9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- Courbe de forme : chute puis remontée franche -->
  <path d="M96 318 L164 272 L214 330 L268 196 L322 250 L416 142"
        fill="none" stroke="#ffffff" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Point de mesure du jour -->
  <circle cx="416" cy="142" r="30" fill="#ffffff"/>
  <circle cx="416" cy="142" r="13" fill="#4f8ff7"/>

  <!-- Ligne de base, discrète -->
  <path d="M96 392 L416 392" stroke="#ffffff" stroke-opacity="0.34"
        stroke-width="14" stroke-linecap="round"/>
</svg>
